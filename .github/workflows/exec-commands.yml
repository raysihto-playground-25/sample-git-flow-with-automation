name: exec-commands

# =============================================================================
# exec-commands - Project-Specific Exec Commands Caller
# =============================================================================
# This is the project-specific caller workflow that invokes exec-related
# reusable workflows with project-specific configuration.
#
# Currently supported commands:
# - /exec merge - See exec-merge.yml for details
#
# CUSTOMIZATION:
# - Modify the `with` inputs below to match your project's branching strategy
# - The reusable workflows handle all the logic, so you only need to
#   configure the branch naming conventions here
# =============================================================================

on:
  issue_comment:
    types: [created]

# Concurrency per PR number to avoid parallel execution
concurrency:
  group: exec-commands-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  exec-merge:
    # Only run if this is a PR comment (not an issue)
    if: github.event.issue.pull_request
    uses: ./.github/workflows/exec-merge.yml
    with:
      # Project-specific branch naming configuration
      release_branch_prefix: "release/"
      develop_branch: "develop"
      sync_branch_prefix: "fix/sync/"
      # Optional: customize the command pattern (default: /exec merge)
      # command_regex: '^[[:space:]]*/exec[[:space:]]+merge[[:space:]]*$'
      # Optional: customize retry behavior for mergeable status
      # mergeable_retry_count: 5
      # mergeable_retry_interval: 10
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
