name: on-comment

# =============================================================================
# on-comment - Project-Specific lysbot Commands Caller
# =============================================================================
# This is the project-specific caller workflow that invokes lysbot-related
# actions with project-specific configuration.
#
# Currently supported commands:
# - /lysbot merge - See .github/actions/lysbot-merge/action.yml for details
# - /lysbot rebase - Triggers lysbot-merge-upgrade-deps workflow for the PR branch
#
# CUSTOMIZATION:
# - Modify the `with` inputs below to match your project's branching strategy
# - The actions handle all the logic, so you only need to
#   configure the branch naming conventions here
# =============================================================================

on:
  issue_comment:
    types: [created]

# Concurrency per PR number to avoid parallel execution
concurrency:
  group: on-comment-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  lysbot-commands:
    name: lysbot-commands
    # Only run if this is a PR comment (not an issue)
    if: github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Handle /lysbot rebase command
        id: rebase
        if: contains(github.event.comment.body, '/lysbot rebase')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Add eyes reaction for acknowledgment
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });
            
            // Get PR details to retrieve head ref
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const headRef = pr.data.head.ref;
            
            // Validation constants
            const BRANCH_NAME_PATTERN = /^[a-zA-Z0-9][a-zA-Z0-9/_.-]*$/;
            const MAX_BRANCH_LENGTH = 255;
            const CONSECUTIVE_DOTS_PATTERN = /\.{2,}/;
            
            // Validate branch name to prevent injection
            // GitHub's own validation ensures branch names are safe
            // This additional check provides defense in depth
            // - Must start with alphanumeric to avoid flag-like names
            // - Allow common characters: alphanumeric, /, _, -, .
            // - Block consecutive dots to prevent path traversal
            if (
              !BRANCH_NAME_PATTERN.test(headRef) || 
              headRef.length > MAX_BRANCH_LENGTH ||
              CONSECUTIVE_DOTS_PATTERN.test(headRef)
            ) {
              core.setFailed('Invalid branch name format detected');
              throw new Error('Invalid branch name format');
            }
            
            // Sanitize branch name for logging
            // Remove control characters, zero-width spaces, and directional overrides
            const sanitizedHeadRef = headRef
              .replace(/[\x00-\x1F\x7F]/g, '')           // Control characters
              .replace(/[\u200B-\u200D\uFEFF]/g, '')     // Zero-width spaces
              .replace(/[\u202A-\u202E\u2066-\u2069]/g, ''); // Directional overrides
            core.info(`Triggering lysbot-merge-upgrade-deps workflow for branch: ${sanitizedHeadRef}`);
            
            // Trigger the workflow with error handling
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'lysbot-merge-upgrade-deps.yml',
                ref: headRef
              });
              
              // Set output to indicate rebase was processed
              core.setOutput('processed', 'true');
            } catch (error) {
              // Log error for debugging but fail the step
              core.setFailed(`Failed to trigger workflow: ${error.message}`);
              throw error;
            }

      - name: Run lysbot-merge action
        if: steps.rebase.outputs.processed != 'true'
        uses: raysihto-playground-25/sample-git-flow-with-automation/.github/actions/lysbot-merge@develop
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ## Project-specific branch naming configuration
          # release_branch_prefix: "release/"
          # develop_branch: "develop"
          # sync_branch_prefix: "fix/sync/"
          ## Optional: customize retry behavior for mergeable status
          # mergeable_retry_count: 5
          # mergeable_retry_interval: 10
