name: on-comment

# =============================================================================
# on-comment - Project-Specific lysbot Commands Caller
# =============================================================================
# This is the project-specific caller workflow that invokes lysbot-related
# actions with project-specific configuration.
#
# Currently supported commands:
# - /lysbot merge - See .github/actions/lysbot-merge/action.yml for details
#
# CUSTOMIZATION:
# - Modify the `with` inputs below to match your project's branching strategy
# - The actions handle all the logic, so you only need to
#   configure the branch naming conventions here
# =============================================================================

on:
  issue_comment:
    types: [created]

# Concurrency per PR number to avoid parallel execution
concurrency:
  group: on-comment-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  trigger-deps-upgrade:
    name: Trigger Dependency Upgrade
    # Only run if this is a PR comment (not an issue) and contains /lysbot merge
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/lysbot merge')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get PR branch name
        id: get-branch
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('branch', pr.head.ref);
            core.info(`PR branch: ${pr.head.ref}`);

      - name: Trigger lysbot-merge-upgrade-deps workflow
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ steps.get-branch.outputs.branch }}';
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'lysbot-merge-trigger',
              client_payload: {
                ref: branch,
                triggered_by: context.actor,
                pr_number: context.issue.number
              }
            });
            core.info(`Triggered lysbot-merge-upgrade-deps workflow for branch: ${branch}`);

  lysbot-merge:
    name: lysbot-merge
    # Only run if this is a PR comment (not an issue)
    if: |
      always() &&
      github.event.issue.pull_request &&
      (needs.trigger-deps-upgrade.result == 'success' || needs.trigger-deps-upgrade.result == 'skipped')
    needs: [trigger-deps-upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Run lysbot-merge action
        uses: raysihto-playground-25/sample-git-flow-with-automation/.github/actions/lysbot-merge@develop
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ## Project-specific branch naming configuration
          # release_branch_prefix: "release/"
          # develop_branch: "develop"
          # sync_branch_prefix: "fix/sync/"
          ## Optional: customize retry behavior for mergeable status
          # mergeable_retry_count: 5
          # mergeable_retry_interval: 10
