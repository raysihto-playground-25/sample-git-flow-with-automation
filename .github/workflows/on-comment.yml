name: on-comment

# =============================================================================
# on-comment - Project-Specific lysbot Commands Caller
# =============================================================================
# This is the project-specific caller workflow that invokes lysbot-related
# actions with project-specific configuration.
#
# Currently supported commands:
# - /lysbot merge - See .github/actions/lysbot-merge/action.yml for details
# - /lysbot rebase - Triggers lysbot-merge-upgrade-deps workflow for the PR branch
#
# CUSTOMIZATION:
# - Modify the `with` inputs below to match your project's branching strategy
# - The actions handle all the logic, so you only need to
#   configure the branch naming conventions here
# =============================================================================

on:
  issue_comment:
    types: [created]

# Concurrency per PR number to avoid parallel execution
concurrency:
  group: on-comment-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  lysbot-commands:
    name: lysbot-commands
    # Only run if this is a PR comment (not an issue)
    if: github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Handle /lysbot rebase command
        id: rebase
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Parse /lysbot rebase command (similar to /lysbot merge validation)
            // Command regex: matches "/lysbot rebase" at the start of the comment
            const REBASE_COMMAND_REGEX = /^\s*\/lysbot\s+rebase\s*$/;
            const commentBody = context.payload.comment.body;
            
            // Check if this is a /lysbot rebase command
            if (!REBASE_COMMAND_REGEX.test(commentBody)) {
              core.info('Not a /lysbot rebase command, skipping');
              core.setOutput('is_rebase_command', 'false');
              return;
            }
            
            // Set output to indicate this is a rebase command
            // This prevents lysbot-merge action from running
            core.setOutput('is_rebase_command', 'true');
            
            // Add eyes reaction for acknowledgment
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });
            
            // Get PR details to retrieve head ref
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const headRef = pr.data.head.ref;
            
            core.info(`Triggering lysbot-merge-upgrade-deps workflow for branch: ${headRef}`);
            
            // Trigger the workflow
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'lysbot-merge-upgrade-deps.yml',
                ref: headRef
              });
            } catch (error) {
              core.setFailed(`Failed to trigger workflow: ${error.message}`);
              throw error;
            }

      - name: Run lysbot-merge action
        if: steps.rebase.outputs.is_rebase_command != 'true'
        uses: raysihto-playground-25/sample-git-flow-with-automation/.github/actions/lysbot-merge@develop
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ## Project-specific branch naming configuration
          # release_branch_prefix: "release/"
          # develop_branch: "develop"
          # sync_branch_prefix: "fix/sync/"
          ## Optional: customize retry behavior for mergeable status
          # mergeable_retry_count: 5
          # mergeable_retry_interval: 10
