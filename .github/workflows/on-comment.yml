name: on-comment

# =============================================================================
# on-comment - Project-Specific lysbot Commands Caller
# =============================================================================
# This is the project-specific caller workflow that invokes lysbot-related
# actions with project-specific configuration.
#
# Currently supported commands:
# - /lysbot merge - See .github/actions/lysbot-merge/action.yml for details
# - /lysbot rebase - Triggers lysbot-merge-upgrade-deps workflow for the PR branch
#
# CUSTOMIZATION:
# - Modify the `with` inputs below to match your project's branching strategy
# - The actions handle all the logic, so you only need to
#   configure the branch naming conventions here
# =============================================================================

on:
  issue_comment:
    types: [created]

# Concurrency per PR number to avoid parallel execution
concurrency:
  group: on-comment-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  lysbot-rebase:
    name: lysbot-rebase
    # Only run if this is a PR comment with /lysbot rebase command
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/lysbot rebase')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - name: Add reaction to comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Trigger lysbot-merge-upgrade-deps workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Get PR details to retrieve head ref
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const headRef = pr.data.head.ref;
            
            // Validate branch name to prevent injection
            // GitHub's own validation ensures branch names are safe
            // This additional check provides defense in depth
            // Allow common characters in branch names: alphanumeric, /, _, -, .
            // Disallow potentially dangerous sequences like '..' for path traversal
            if (
              !/^[a-zA-Z0-9/_.-]+$/.test(headRef) || 
              headRef.length > 255 ||
              headRef.includes('..')
            ) {
              core.setFailed('Invalid branch name format detected');
              throw new Error('Invalid branch name format');
            }
            
            core.info(`Triggering lysbot-merge-upgrade-deps workflow for branch: ${headRef}`);
            
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'lysbot-merge-upgrade-deps.yml',
                ref: headRef
              });
              
              // Add success reaction
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'rocket'
              });
              
              // Post success comment with properly encoded branch name for markdown
              // Comprehensive escaping of markdown special characters
              // Note: & must be replaced first to avoid double-escaping
              const escapedBranchName = headRef
                .replace(/&/g, '&amp;')
                .replace(/\\/g, '\\\\')
                .replace(/`/g, '\\`')
                .replace(/\*/g, '\\*')
                .replace(/_/g, '\\_')
                .replace(/\[/g, '\\[')
                .replace(/\]/g, '\\]')
                .replace(/#/g, '\\#')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\|/g, '\\|');
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `✅ Successfully triggered \`lysbot-merge-upgrade-deps\` workflow for branch \`${escapedBranchName}\`.\n\nYou can monitor the workflow run [here](${context.payload.repository.html_url}/actions/workflows/lysbot-merge-upgrade-deps.yml).`
              });
            } catch (error) {
              // Log with safe status code handling for debugging
              const safeStatusCodes = [400, 401, 403, 404, 409, 422, 429, 500, 502, 503];
              const statusCode = error.status && safeStatusCodes.includes(error.status) 
                ? error.status 
                : 'unknown';
              core.setFailed(`Failed to trigger workflow. Status: ${statusCode}`);
              
              // Add failure reaction
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'confused'
              });
              
              // Use predefined messages based on status code for user feedback
              let userMessage;
              if (error.status === 404) {
                userMessage = '❌ Failed to trigger workflow. The workflow file or branch may not exist.';
              } else if (error.status === 403 || error.status === 401) {
                userMessage = '❌ Failed to trigger workflow. Insufficient permissions to trigger workflows.';
              } else if (error.status === 422) {
                userMessage = '❌ Failed to trigger workflow. Invalid request parameters.';
              } else if (error.status === 429) {
                userMessage = '❌ Failed to trigger workflow. Rate limit exceeded. Please try again later.';
              } else {
                userMessage = '❌ Failed to trigger workflow. Please check that the branch exists and you have permission to trigger workflows.';
              }
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: userMessage
              });
              
              throw error;
            }

  lysbot-merge:
    name: lysbot-merge
    # Only run if this is a PR comment (not an issue)
    if: github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Run lysbot-merge action
        uses: raysihto-playground-25/sample-git-flow-with-automation/.github/actions/lysbot-merge@develop
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ## Project-specific branch naming configuration
          # release_branch_prefix: "release/"
          # develop_branch: "develop"
          # sync_branch_prefix: "fix/sync/"
          ## Optional: customize retry behavior for mergeable status
          # mergeable_retry_count: 5
          # mergeable_retry_interval: 10
