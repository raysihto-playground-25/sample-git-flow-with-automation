name: exec-merge

# =============================================================================
# exec-merge - Project-Specific PR Merge Automation
# =============================================================================
# This is the project-specific caller workflow that invokes the reusable
# exec-merge-shared workflow with project-specific configuration.
#
# For details on how the merge automation works, see exec-merge-shared.yml
#
# CUSTOMIZATION:
# - Modify the `with` inputs below to match your project's branching strategy
# - The reusable workflow handles all the merge logic, so you only need to
#   configure the branch naming conventions here
# =============================================================================

on:
  issue_comment:
    types: [created]

# Concurrency per PR number to avoid parallel execution
concurrency:
  group: exec-merge-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  exec-merge:
    # Only run if this is a PR comment (not an issue)
    if: github.event.issue.pull_request
    uses: ./.github/workflows/exec-merge-shared.yml
    with:
      # Project-specific branch naming configuration
      release_branch_prefix: "release/"
      develop_branch: "develop"
      sync_branch_prefix: "fix/sync/"
      # Optional: customize the command pattern (default: /exec merge)
      # command_regex: '^[[:space:]]*/exec[[:space:]]+merge[[:space:]]*$'
      # Optional: customize retry behavior for mergeable status
      # mergeable_retry_count: 5
      # mergeable_retry_interval: 10
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
