name: exec-merge

# =============================================================================
# exec-merge - PR Merge Automation Workflow
# =============================================================================
# This workflow provides automated PR merging for repositories where branch
# protection rules are unavailable (e.g., GitHub Free plan) or when additional
# merge controls are needed beyond what branch protection offers.
#
# LIMITATIONS:
# - Fork PRs are NOT supported: GITHUB_TOKEN has limited write permissions for
#   fork-originated PRs by default, which will cause merge operations to fail.
# - Only organization owners, members, or collaborators with sufficient access
#   can use the `/exec merge` command.
#
# THIRD-PARTY LICENSES:
# - Twemoji graphics (https://github.com/twitter/twemoji) are used for emoji
#   display compatibility. Twemoji graphics are licensed under CC-BY 4.0:
#   https://creativecommons.org/licenses/by/4.0/
#   Copyright 2020 Twitter, Inc and other contributors
# =============================================================================

on:
  issue_comment:
    types: [created]

env:
  RELEASE_BRANCH_PREFIX: "release/"
  DEVELOP_BRANCH: "develop"
  # Sync branches are used to back-merge changes from release branches to develop.
  # These branches use merge commits instead of squash to preserve full commit history.
  SYNC_BRANCH_PREFIX: "fix/sync/"
  # Command regex using POSIX character classes for Bash ERE compatibility
  COMMAND_REGEX: '^[[:space:]]*/exec[[:space:]]+merge[[:space:]]*$'
  # Retry configuration for waiting on GitHub to calculate mergeable status
  MERGEABLE_RETRY_COUNT: "5"
  MERGEABLE_RETRY_INTERVAL: "10"
  # Twemoji images for cross-browser emoji compatibility (CC-BY 4.0 licensed)
  # https://github.com/twitter/twemoji
  TWEMOJI_CHECK: '<img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/2705.svg" width="20" height="20" alt="OK">'
  TWEMOJI_CROSS: '<img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/274c.svg" width="20" height="20" alt="NG">'

# Concurrency per PR number to avoid parallel execution
concurrency:
  group: exec-merge-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  exec-merge:
    name: exec-merge
    # Only run if this is a PR comment (not an issue)
    if: github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # Combined step for fastest reaction: check bot, validate command, add reaction
      - name: Validate command and add reaction
        id: validate_command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMAND_REGEX: ${{ env.COMMAND_REGEX }}
          USER_TYPE: ${{ github.event.comment.user.type }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          
          # Check if comment is from a bot
          if [ "$USER_TYPE" = "Bot" ]; then
            echo "Comment is from a bot, skipping"
            echo "is_bot=true" >> $GITHUB_OUTPUT
            echo "command_valid=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "is_bot=false" >> $GITHUB_OUTPUT
          
          # Check if comment matches command regex
          echo "Checking if comment matches command regex..."
          if [[ "$COMMENT_BODY" =~ $COMMAND_REGEX ]]; then
            echo "Command matched!"
            echo "command_valid=true" >> $GITHUB_OUTPUT
            
            # Add eyes reaction immediately for fastest feedback
            echo "Adding :eyes: reaction to comment $COMMENT_ID"
            gh api repos/$REPO/issues/comments/$COMMENT_ID/reactions \
              -X POST \
              -f content="eyes" || echo "Failed to add reaction (may already exist)"
          else
            echo "Command did not match"
            echo "command_valid=false" >> $GITHUB_OUTPUT
          fi

      - name: Check author association
        id: check_author
        if: steps.validate_command.outputs.is_bot == 'false' && steps.validate_command.outputs.command_valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          
          echo "Author association: $AUTHOR_ASSOCIATION"
          echo "Actor: $ACTOR"
          
          # Check 1: author_association must be OWNER, MEMBER, or COLLABORATOR
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "Author association check passed"
              ;;
            *)
              echo "Author association check failed"
              
              COMMENT_BODY="## Permission denied\n\nOnly repository owners, members, and collaborators can use the \`/exec merge\` command.\n\nYour association: \`$AUTHOR_ASSOCIATION\`"
              
              gh api repos/$REPO/issues/$PR_NUMBER/comments \
                -f body="$COMMENT_BODY"

              exit 1
              ;;
          esac
          
          # Check 2: Verify user has write+ permission on the repository (write, maintain, admin)
          echo "Checking repository permission level..."
          
          # Fetch collaborator permission for the actor
          PERM_RESPONSE=$(gh api repos/$REPO/collaborators/$ACTOR/permission 2>&1) || {
            echo "Failed to fetch permission: $PERM_RESPONSE"
            
            COMMENT_BODY="## Permission check failed\n\nUnable to verify your repository permissions. This may occur if:\n- You are not a collaborator on this repository\n- The API call failed\n\nPlease ensure you have write access to this repository."
            
            gh api repos/$REPO/issues/$PR_NUMBER/comments \
              -f body="$COMMENT_BODY"
            
            exit 1
          }
          
          PERMISSION=$(echo "$PERM_RESPONSE" | jq -r '.permission // "none"')
          echo "Repository permission level: $PERMISSION"
          
          case "$PERMISSION" in
            admin|maintain|write)
              echo "Repository permission check passed"
              echo "allowed=true" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Insufficient repository permissions"
              echo "allowed=false" >> $GITHUB_OUTPUT
              
              COMMENT_BODY="## Permission denied\n\nYou need at least **write** permission on this repository to use the \`/exec merge\` command.\n\nYour association: \`$AUTHOR_ASSOCIATION\`\nYour permission level: \`$PERMISSION\`"
              
              gh api repos/$REPO/issues/$PR_NUMBER/comments \
                -f body="$COMMENT_BODY"

              exit 1
              ;;
          esac

      - name: Check if fork PR
        id: check_fork
        if: |
          steps.validate_command.outputs.is_bot == 'false' && 
          steps.validate_command.outputs.command_valid == 'true' && 
          steps.check_author.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          
          # Get PR data to check if it's from a fork
          # Use robust detection: check head.repo.fork flag OR compare owner IDs
          # This handles cases where head.repo.full_name is null (e.g., fork repo deleted)
          PR_DATA=$(gh api repos/$REPO/pulls/$PR_NUMBER)
          IS_FORK=$(echo "$PR_DATA" | jq -r '(.head.repo.fork // false) or ((.head.repo.owner.id // 0) != (.base.repo.owner.id // 0))')
          HEAD_REPO_NAME=$(echo "$PR_DATA" | jq -r '.head.repo.full_name // "(null)"')
          BASE_REPO_NAME=$(echo "$PR_DATA" | jq -r '.base.repo.full_name')
          
          echo "Head repo: $HEAD_REPO_NAME"
          echo "Base repo: $BASE_REPO_NAME"
          echo "Is fork (robust check): $IS_FORK"
          
          if [ "$IS_FORK" = "true" ]; then
            echo "This is a fork PR - not supported"
            echo "is_fork=true" >> $GITHUB_OUTPUT
            
            # Post comment about fork PR limitation
            COMMENT_BODY="## Fork PR not supported\n\nThe \`/exec merge\` command is not supported for PRs from forked repositories.\n\nThis is because the GITHUB_TOKEN has limited write permissions for fork-originated PRs by default."
            
            gh api repos/$REPO/issues/$PR_NUMBER/comments \
              -f body="$COMMENT_BODY"
            
            exit 1
          else
            echo "This is not a fork PR"
            echo "is_fork=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch PR data
        id: pr_data
        if: |
          steps.validate_command.outputs.is_bot == 'false' && 
          steps.validate_command.outputs.command_valid == 'true' &&
          steps.check_author.outputs.allowed == 'true' &&
          steps.check_fork.outputs.is_fork == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          
          echo "Fetching PR #$PR_NUMBER data..."
          
          # Get PR data using gh api
          PR_DATA=$(gh api repos/$REPO/pulls/$PR_NUMBER)
          
          # Extract key fields, log them, and set outputs using a single jq process
          # for better performance and maintainability.
          echo "$PR_DATA" | jq -r '
            "state=\(.state)\n" +
            "locked=\(.locked)\n" +
            "draft=\(.draft)\n" +
            "merged=\(.merged)\n" +
            "mergeable=\(.mergeable // "null")\n" +
            "mergeable_state=\(.mergeable_state)\n" +
            "head_sha=\(.head.sha)\n" +
            "head_ref=\(.head.ref)\n" +
            "base_ref=\(.base.ref)\n" +
            "author=\(.user.login)"
          ' | while IFS= read -r line; do
            echo "$line" >> $GITHUB_OUTPUT
            # Remap for logging to match original output format
            case "${line%%=*}" in
              state) echo "PR State: ${line#*=}" ;;
              locked) echo "Locked: ${line#*=}" ;;
              draft) echo "Draft: ${line#*=}" ;;
              merged) echo "Merged: ${line#*=}" ;;
              mergeable) echo "Mergeable: ${line#*=}" ;;
              mergeable_state) echo "Mergeable State: ${line#*=}" ;;
              head_sha) echo "Head SHA: ${line#*=}" ;;
              head_ref) echo "Head Ref: ${line#*=}" ;;
              base_ref) echo "Base Ref: ${line#*=}" ;;
              author) echo "Author: ${line#*=}" ;;
            esac
          done

      - name: Check if already merged
        id: check_merged
        if: |
          steps.validate_command.outputs.is_bot == 'false' && 
          steps.validate_command.outputs.command_valid == 'true' &&
          steps.check_author.outputs.allowed == 'true' &&
          steps.check_fork.outputs.is_fork == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGED: ${{ steps.pr_data.outputs.merged }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          
          if [ "$MERGED" = "true" ]; then
            echo "PR is already merged"
            echo "already_merged=true" >> $GITHUB_OUTPUT
            
            # Post comment
            COMMENT_BODY=$(printf '## Already merged\n\nThis PR has already been merged.')
            gh api repos/$REPO/issues/$PR_NUMBER/comments -f body="$COMMENT_BODY"
          else
            echo "already_merged=false" >> $GITHUB_OUTPUT
          fi

      - name: Check PR status (closed/locked/draft)
        id: check_pr_status
        if: steps.check_merged.outputs.already_merged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ steps.pr_data.outputs.state }}
          LOCKED: ${{ steps.pr_data.outputs.locked }}
          DRAFT: ${{ steps.pr_data.outputs.draft }}
          MERGEABLE_STATE: ${{ steps.pr_data.outputs.mergeable_state }}
        run: |
          set -Eeuo pipefail
          
          # Initialize check results
          PR_OPEN_OK="true"
          PR_UNLOCKED_OK="true"
          PR_NOT_DRAFT_OK="true"
          NO_CONFLICTS_OK="true"
          
          # Check if PR is closed
          if [ "$STATE" = "closed" ]; then
            PR_OPEN_OK="false"
          fi
          
          # Check if PR is locked
          if [ "$LOCKED" = "true" ]; then
            PR_UNLOCKED_OK="false"
          fi
          
          # Check if PR is a draft
          if [ "$DRAFT" = "true" ]; then
            PR_NOT_DRAFT_OK="false"
          fi
          
          # Check mergeable state for conflicts
          # Only "clean" means no issues - all other states indicate some problem
          case "$MERGEABLE_STATE" in
            clean)
              NO_CONFLICTS_OK="true"
              ;;
            *)
              # All other states (dirty, blocked, unstable, behind, unknown, has_hooks, draft, etc.)
              NO_CONFLICTS_OK="false"
              ;;
          esac
          
          # Output individual check results
          echo "pr_open_ok=$PR_OPEN_OK" >> $GITHUB_OUTPUT
          echo "pr_unlocked_ok=$PR_UNLOCKED_OK" >> $GITHUB_OUTPUT
          echo "pr_not_draft_ok=$PR_NOT_DRAFT_OK" >> $GITHUB_OUTPUT
          echo "no_conflicts_ok=$NO_CONFLICTS_OK" >> $GITHUB_OUTPUT
          echo "mergeable_state=$MERGEABLE_STATE" >> $GITHUB_OUTPUT
          
          # Overall status
          if [ "$PR_OPEN_OK" = "true" ] && [ "$PR_UNLOCKED_OK" = "true" ] && [ "$PR_NOT_DRAFT_OK" = "true" ] && [ "$NO_CONFLICTS_OK" = "true" ]; then
            echo "PR status checks passed"
            echo "status_ok=true" >> $GITHUB_OUTPUT
          else
            echo "PR status checks failed"
            echo "status_ok=false" >> $GITHUB_OUTPUT
          fi

      # This step runs regardless of PR status to collect all validation errors at once
      - name: Check approvals and dismiss stale ones
        id: check_approvals
        if: steps.check_merged.outputs.already_merged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr_data.outputs.head_sha }}
          PR_AUTHOR: ${{ steps.pr_data.outputs.author }}
        run: |
          set -Eeuo pipefail
          
          echo "Checking approvals for PR #$PR_NUMBER (head SHA: $HEAD_SHA)..."
          echo "PR Author: $PR_AUTHOR (self-approvals will be excluded)"
          
          # Get all reviews
          REVIEWS=$(gh api repos/$REPO/pulls/$PR_NUMBER/reviews --paginate)
          
          # Find approved reviews
          APPROVED_REVIEWS=$(echo "$REVIEWS" | jq '[.[] | select(.state == "APPROVED")]')
          APPROVED_COUNT=$(echo "$APPROVED_REVIEWS" | jq 'length')
          
          echo "Found $APPROVED_COUNT approved reviews"
          
          STALE_REVIEWS_DISMISSED=false
          STALE_REVIEW_MESSAGES=""
          DISMISS_FAILED_MESSAGES=""
          VALID_APPROVALS=0
          
          # Check each approved review using TSV format for better readability
          if [ "$APPROVED_COUNT" -gt 0 ]; then
            while IFS=$'\t' read -r REVIEW_ID COMMIT_ID USER; do
              # Skip if essential values are empty
              if [ -z "$REVIEW_ID" ] || [ -z "$COMMIT_ID" ] || [ -z "$USER" ]; then
                echo "Warning: Could not parse review fields. Skipping."
                continue
              fi
              
              echo "Review ID: $REVIEW_ID, Commit ID: $COMMIT_ID, User: $USER"
              
              # Exclude PR author's own approval (self-approval)
              if [ "$USER" = "$PR_AUTHOR" ]; then
                echo "Skipping self-approval from PR author @$USER"
                continue
              fi
              
              if [ "$COMMIT_ID" != "$HEAD_SHA" ]; then
                echo "Review $REVIEW_ID is stale (commit: $COMMIT_ID, current: $HEAD_SHA). Dismissing..."
                
                DISMISS_MESSAGE="Approval dismissed: New commits were pushed after this review was submitted (reviewed commit: ${COMMIT_ID:0:7}, current HEAD: ${HEAD_SHA:0:7})."
                
                # Dismiss the stale review and capture failure
                DISMISS_FAILED=false
                DISMISS_RESULT=$(gh api repos/$REPO/pulls/$PR_NUMBER/reviews/$REVIEW_ID/dismissals \
                  -X PUT \
                  -f message="$DISMISS_MESSAGE" 2>&1) || DISMISS_FAILED=true
                if [ "$DISMISS_FAILED" = "true" ]; then
                  echo "Warning: Failed to dismiss review $REVIEW_ID: $DISMISS_RESULT"
                  DISMISS_FAILED_MESSAGES="${DISMISS_FAILED_MESSAGES}- Failed to dismiss approval from @$USER (insufficient permissions or branch protection settings)\n"
                else
                  STALE_REVIEWS_DISMISSED=true
                  STALE_REVIEW_MESSAGES="${STALE_REVIEW_MESSAGES}- Dismissed approval from @$USER (reviewed commit: \`${COMMIT_ID:0:7}\`, current HEAD: \`${HEAD_SHA:0:7}\`)\n"
                fi
              else
                echo "Review $REVIEW_ID is valid (matches current HEAD SHA)"
                VALID_APPROVALS=$((VALID_APPROVALS + 1))
              fi
            done < <(echo "$APPROVED_REVIEWS" | jq -r '.[] | "\(.id)\t\(.commit_id)\t\(.user.login)"')
          fi
          
          echo "Valid approvals: $VALID_APPROVALS"
          echo "valid_approvals=$VALID_APPROVALS" >> $GITHUB_OUTPUT
          
          # If stale reviews were dismissed, notify
          if [ "$STALE_REVIEWS_DISMISSED" = "true" ] || [ -n "$DISMISS_FAILED_MESSAGES" ]; then
            echo "stale_dismissed=true" >> $GITHUB_OUTPUT
            delimiter="$(openssl rand -hex 8)"
            echo "stale_messages<<${delimiter}" >> $GITHUB_OUTPUT
            echo -e "$STALE_REVIEW_MESSAGES" >> $GITHUB_OUTPUT
            echo "${delimiter}" >> $GITHUB_OUTPUT
            
            STALE_COMMENT=""
            if [ -n "$STALE_REVIEW_MESSAGES" ]; then
              STALE_COMMENT=$(printf '## Stale approvals dismissed\n\nThe following approvals were dismissed because new commits were pushed after the reviews:\n\n%b' "$STALE_REVIEW_MESSAGES")
            fi
            
            # Report dismiss failures if any
            if [ -n "$DISMISS_FAILED_MESSAGES" ]; then
              if [ -n "$STALE_COMMENT" ]; then
                STALE_COMMENT=$(printf '%s\n\n### Dismiss failures\n\nThe following approvals could not be dismissed (consider enabling "Dismiss stale pull request approvals when new commits are pushed" in branch protection settings):\n\n%b' "$STALE_COMMENT" "$DISMISS_FAILED_MESSAGES")
              else
                STALE_COMMENT=$(printf '## Stale approval dismiss failures\n\nThe following approvals could not be dismissed (consider enabling "Dismiss stale pull request approvals when new commits are pushed" in branch protection settings):\n\n%b' "$DISMISS_FAILED_MESSAGES")
              fi
            fi
            
            gh api repos/$REPO/issues/$PR_NUMBER/comments \
              -f body="$STALE_COMMENT"
          else
            echo "stale_dismissed=false" >> $GITHUB_OUTPUT
          fi
          
          # Check if we have at least one valid approval
          if [ "$VALID_APPROVALS" -lt 1 ]; then
            echo "approval_ok=false" >> $GITHUB_OUTPUT
          else
            echo "approval_ok=true" >> $GITHUB_OUTPUT
          fi

      # GraphQL is used because REST API doesn't provide review thread resolution status
      # This step runs regardless of PR status or approval status to collect all validation errors at once
      - name: Check review threads are resolved
        id: check_threads
        if: steps.check_merged.outputs.already_merged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          
          # Helper function to post failure comment and exit
          fail_with_comment() {
            local message="$1"
            echo "$message"
            COMMENT_BODY=$(printf '## Merge checks failed\n\n%s' "$message")
            gh api repos/$REPO/issues/$PR_NUMBER/comments -f body="$COMMENT_BODY"
            exit 1
          }
          
          echo "Checking review threads for PR #$PR_NUMBER..."
          
          UNRESOLVED_THREADS=0
          HAS_NEXT_PAGE=true
          CURSOR=""
          
          QUERY='query($owner: String!, $name: String!, $number: Int!, $cursor: String) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                reviewThreads(first: 100, after: $cursor) {
                  pageInfo {
                    hasNextPage
                    endCursor
                  }
                  nodes {
                    isResolved
                    isOutdated
                  }
                }
              }
            }
          }'
          
          while [ "$HAS_NEXT_PAGE" = "true" ]; do
            # Build GraphQL arguments dynamically to avoid code duplication
            # Use -F for number to pass it as an integer (Int! in GraphQL), -f for strings
            GRAPHQL_ARGS=("-f" "query=$QUERY" "-f" "owner=$OWNER" "-f" "name=$REPO_NAME" "-F" "number=$PR_NUMBER")
            if [ -n "$CURSOR" ]; then
              GRAPHQL_ARGS+=("-f" "cursor=$CURSOR")
            fi
            
            RESPONSE=$(gh api graphql "${GRAPHQL_ARGS[@]}") || {
              fail_with_comment "Failed to fetch review threads status. Please try again."
            }
            
            # Check for GraphQL errors in the response
            if echo "$RESPONSE" | jq -e '.errors' > /dev/null 2>&1; then
              echo "GraphQL query returned errors:"
              echo "$RESPONSE" | jq '.errors'
              fail_with_comment "An error occurred while fetching review threads status. Please try again."
            fi
            
            # Count unresolved threads (excluding outdated ones is optional, but we count all unresolved)
            # Use // [] to safely handle cases where nodes might be null or missing
            PAGE_UNRESOLVED=$(echo "$RESPONSE" | jq '(.data.repository.pullRequest.reviewThreads.nodes // []) | map(select(.isResolved == false)) | length')
            PAGE_UNRESOLVED=${PAGE_UNRESOLVED:-0}
            UNRESOLVED_THREADS=$((UNRESOLVED_THREADS + PAGE_UNRESOLVED))
            
            # Check for next page
            HAS_NEXT_PAGE=$(echo "$RESPONSE" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage')
            # Explicitly validate HAS_NEXT_PAGE to avoid infinite loops or unexpected behavior
            if [ "$HAS_NEXT_PAGE" != "true" ] && [ "$HAS_NEXT_PAGE" != "false" ]; then
              echo "Unexpected value for hasNextPage: '$HAS_NEXT_PAGE'. Failing for safety."
              fail_with_comment "Unexpected response from GitHub API (hasNextPage=$HAS_NEXT_PAGE). Please try again or contact support."
            fi
            CURSOR=$(echo "$RESPONSE" | jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor // ""')
            
            echo "Page processed. Unresolved in this page: $PAGE_UNRESOLVED, Has next page: $HAS_NEXT_PAGE"
          done
          
          echo "Total unresolved threads: $UNRESOLVED_THREADS"
          echo "unresolved_count=$UNRESOLVED_THREADS" >> $GITHUB_OUTPUT
          
          if [ "$UNRESOLVED_THREADS" -gt 0 ]; then
            echo "threads_ok=false" >> $GITHUB_OUTPUT
          else
            echo "threads_ok=true" >> $GITHUB_OUTPUT
          fi

      - name: Determine merge method
        id: merge_method
        if: steps.check_merged.outputs.already_merged == 'false'
        env:
          BASE_REF: ${{ steps.pr_data.outputs.base_ref }}
          HEAD_REF: ${{ steps.pr_data.outputs.head_ref }}
          RELEASE_PREFIX: ${{ env.RELEASE_BRANCH_PREFIX }}
          DEVELOP_BRANCH: ${{ env.DEVELOP_BRANCH }}
          SYNC_PREFIX: ${{ env.SYNC_BRANCH_PREFIX }}
        run: |
          set -Eeuo pipefail
          
          echo "Base ref: $BASE_REF"
          echo "Head ref: $HEAD_REF"
          echo "Release prefix: $RELEASE_PREFIX"
          echo "Develop branch: $DEVELOP_BRANCH"
          echo "Sync prefix: $SYNC_PREFIX"
          
          # Determine merge method
          # 1. If base branch starts with RELEASE_BRANCH_PREFIX -> squash
          # 2. If base branch is DEVELOP_BRANCH AND head branch does NOT start with SYNC_BRANCH_PREFIX -> squash
          # 3. Otherwise -> merge (merge commit)
          
          if [[ "$BASE_REF" == "${RELEASE_PREFIX}"* ]]; then
            echo "method=squash" >> $GITHUB_OUTPUT
            echo "reason=Base branch \`$BASE_REF\` is a release branch" >> $GITHUB_OUTPUT
          elif [ "$BASE_REF" = "$DEVELOP_BRANCH" ] && [[ "$HEAD_REF" != "${SYNC_PREFIX}"* ]]; then
            echo "method=squash" >> $GITHUB_OUTPUT
            echo "reason=Base branch is \`$BASE_REF\` and head branch \`$HEAD_REF\` is not a sync branch" >> $GITHUB_OUTPUT
          else
            echo "method=merge" >> $GITHUB_OUTPUT
            echo "reason=Default merge commit for \`$HEAD_REF\` into \`$BASE_REF\`" >> $GITHUB_OUTPUT
          fi

      # Unified check result reporting - aggregates all validation results into a single comment
      - name: Report check results
        id: report_results
        if: steps.check_merged.outputs.already_merged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TWEMOJI_CHECK: ${{ env.TWEMOJI_CHECK }}
          TWEMOJI_CROSS: ${{ env.TWEMOJI_CROSS }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          PR_OPEN_OK: ${{ steps.check_pr_status.outputs.pr_open_ok }}
          PR_UNLOCKED_OK: ${{ steps.check_pr_status.outputs.pr_unlocked_ok }}
          PR_NOT_DRAFT_OK: ${{ steps.check_pr_status.outputs.pr_not_draft_ok }}
          NO_CONFLICTS_OK: ${{ steps.check_pr_status.outputs.no_conflicts_ok }}
          MERGEABLE_STATE: ${{ steps.check_pr_status.outputs.mergeable_state }}
          APPROVAL_OK: ${{ steps.check_approvals.outputs.approval_ok }}
          THREADS_OK: ${{ steps.check_threads.outputs.threads_ok }}
          UNRESOLVED_COUNT: ${{ steps.check_threads.outputs.unresolved_count }}
          VALID_APPROVALS: ${{ steps.check_approvals.outputs.valid_approvals }}
          MERGE_METHOD: ${{ steps.merge_method.outputs.method }}
          MERGE_REASON: ${{ steps.merge_method.outputs.reason }}
        run: |
          set -Eeuo pipefail
          
          # Build check result list using twemoji images for cross-browser compatibility
          # Format: OK = "{check_icon} {desired status}"
          #         NG = "{cross_icon} {desired status} ({current status})"
          # Order matches actual development workflow: open → unlocked → ready for review → resolved threads → approvals → conflicts
          RESULTS=""
          ALL_PASSED=true
          
          # PR is open check
          if [ "$PR_OPEN_OK" = "true" ]; then
            RESULTS="${RESULTS}- ${TWEMOJI_CHECK} PR is open\n"
          else
            RESULTS="${RESULTS}- ${TWEMOJI_CROSS} PR is open (currently closed)\n"
            ALL_PASSED=false
          fi
          
          # PR is unlocked check
          if [ "$PR_UNLOCKED_OK" = "true" ]; then
            RESULTS="${RESULTS}- ${TWEMOJI_CHECK} PR is unlocked\n"
          else
            RESULTS="${RESULTS}- ${TWEMOJI_CROSS} PR is unlocked (currently locked)\n"
            ALL_PASSED=false
          fi
          
          # PR is not draft check (must be ready for review)
          if [ "$PR_NOT_DRAFT_OK" = "true" ]; then
            RESULTS="${RESULTS}- ${TWEMOJI_CHECK} PR is ready for review\n"
          else
            RESULTS="${RESULTS}- ${TWEMOJI_CROSS} PR is ready for review (currently a draft)\n"
            ALL_PASSED=false
          fi
          
          # Threads resolved check (resolve review conversations before approval)
          if [ "$THREADS_OK" = "true" ]; then
            RESULTS="${RESULTS}- ${TWEMOJI_CHECK} All review conversations are resolved\n"
          else
            RESULTS="${RESULTS}- ${TWEMOJI_CROSS} All review conversations are resolved (${UNRESOLVED_COUNT} unresolved)\n"
            ALL_PASSED=false
          fi
          
          # Approval check (get approval after resolving conversations)
          if [ "$APPROVAL_OK" = "true" ]; then
            RESULTS="${RESULTS}- ${TWEMOJI_CHECK} At least one valid approval from another user\n"
          else
            RESULTS="${RESULTS}- ${TWEMOJI_CROSS} At least one valid approval from another user (no valid approvals found)\n"
            ALL_PASSED=false
          fi
          
          # No conflicts check (final check before merge)
          if [ "$NO_CONFLICTS_OK" = "true" ]; then
            RESULTS="${RESULTS}- ${TWEMOJI_CHECK} No merge conflicts\n"
          else
            case "$MERGEABLE_STATE" in
              dirty)
                RESULTS="${RESULTS}- ${TWEMOJI_CROSS} No merge conflicts (has unresolved conflicts)\n"
                ;;
              blocked)
                RESULTS="${RESULTS}- ${TWEMOJI_CROSS} No merge conflicts (blocked by status checks or branch protection)\n"
                ;;
              unstable)
                RESULTS="${RESULTS}- ${TWEMOJI_CROSS} No merge conflicts (has failing status checks)\n"
                ;;
              behind)
                RESULTS="${RESULTS}- ${TWEMOJI_CROSS} No merge conflicts (branch is behind base branch)\n"
                ;;
              unknown)
                RESULTS="${RESULTS}- ${TWEMOJI_CROSS} No merge conflicts (mergeability not yet computed, please retry)\n"
                ;;
              has_hooks)
                RESULTS="${RESULTS}- ${TWEMOJI_CROSS} No merge conflicts (blocked by external hooks)\n"
                ;;
              *)
                RESULTS="${RESULTS}- ${TWEMOJI_CROSS} No merge conflicts (mergeable_state: ${MERGEABLE_STATE})\n"
                ;;
            esac
            ALL_PASSED=false
          fi
          
          # Output overall result and flag that error comment was posted
          echo "all_checks_passed=$ALL_PASSED" >> $GITHUB_OUTPUT
          echo "error_comment_posted=true" >> $GITHUB_OUTPUT
          
          # Save results for later steps (use heredoc delimiter for multiline)
          delimiter="$(openssl rand -hex 8)"
          echo "check_results<<${delimiter}" >> $GITHUB_OUTPUT
          echo -e "$RESULTS" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT
          
          # Post check results comment with merge method info
          if [ "$ALL_PASSED" = "false" ]; then
            # If any check failed, post failure comment
            # Note: We exit with 0 here because failing merge checks is an expected outcome,
            # not a workflow error. The user has been notified via comment.
            COMMENT_BODY=$(printf '## Merge checks failed\n\nThe following checks must pass before merging:\n\n%b\n### Merge Method\n\n- **Method:** `%s`\n- **Reason:** %s' "$RESULTS" "$MERGE_METHOD" "$MERGE_REASON")
            gh api repos/$REPO/issues/$PR_NUMBER/comments -f body="$COMMENT_BODY"
            echo "Validation failed, user notified via comment"
          else
            # All checks passed - post check results comment before proceeding to merge
            COMMENT_BODY=$(printf '## Merge checks passed\n\nAll checks passed. Proceeding to merge...\n\n%b\n### Merge Method\n\n- **Method:** `%s`\n- **Reason:** %s' "$RESULTS" "$MERGE_METHOD" "$MERGE_REASON")
            gh api repos/$REPO/issues/$PR_NUMBER/comments -f body="$COMMENT_BODY"
          fi

      - name: Perform merge
        id: perform_merge
        if: steps.report_results.outputs.all_checks_passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          MERGE_METHOD: ${{ steps.merge_method.outputs.method }}
          ORIGINAL_HEAD_SHA: ${{ steps.pr_data.outputs.head_sha }}
          HEAD_REF: ${{ steps.pr_data.outputs.head_ref }}
          BASE_REF: ${{ steps.pr_data.outputs.base_ref }}
          COMMAND_ISSUER: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          
          # TOCTOU check: Re-fetch PR data immediately before merge
          echo "Performing TOCTOU check before merge..."
          echo "Original HEAD SHA: $ORIGINAL_HEAD_SHA"
          
          PR_DATA=$(gh api repos/$REPO/pulls/$PR_NUMBER)
          
          CURRENT_HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head.sha')
          MERGEABLE=$(echo "$PR_DATA" | jq -r '.mergeable // "null"')
          MERGEABLE_STATE=$(echo "$PR_DATA" | jq -r '.mergeable_state')
          
          echo "Current HEAD SHA: $CURRENT_HEAD_SHA"
          echo "Mergeable: $MERGEABLE"
          echo "Mergeable State: $MERGEABLE_STATE"
          
          # Check for TOCTOU violation
          if [ "$CURRENT_HEAD_SHA" != "$ORIGINAL_HEAD_SHA" ]; then
            echo "TOCTOU violation detected!"
            
            COMMENT_BODY=$(printf '## New commits detected\n\nNew commits were pushed while validating this PR.\n\n- Original HEAD SHA: `%s`\n- Current HEAD SHA: `%s`\n\nPlease run `/exec merge` again after the new commits are reviewed and approved.' "${ORIGINAL_HEAD_SHA:0:7}" "${CURRENT_HEAD_SHA:0:7}")
            
            gh api repos/$REPO/issues/$PR_NUMBER/comments \
              -f body="$COMMENT_BODY"
            
            exit 1
          fi
          
          # Check mergeability (handle null which means GitHub hasn't calculated it yet)
          # Retry configuration is controlled by MERGEABLE_RETRY_COUNT and MERGEABLE_RETRY_INTERVAL env vars
          # Note: If new commits are pushed during this wait period, the TOCTOU check below will fail
          # and the user will need to run /exec merge again after the new commits are reviewed.
          MERGEABLE_RETRY_COUNT=${MERGEABLE_RETRY_COUNT:-5}
          MERGEABLE_RETRY_INTERVAL=${MERGEABLE_RETRY_INTERVAL:-10}
          for i in $(seq 1 $MERGEABLE_RETRY_COUNT); do
            if [ "$MERGEABLE" != "null" ]; then
              break
            fi
            if [ $i -eq 1 ]; then
              echo "Mergeable status is not yet available (is null). Waiting..."
            fi
            sleep $MERGEABLE_RETRY_INTERVAL
            echo "Re-fetching PR data (Attempt $i/$MERGEABLE_RETRY_COUNT)"
            PR_DATA=$(gh api repos/$REPO/pulls/$PR_NUMBER)
            MERGEABLE=$(echo "$PR_DATA" | jq -r '.mergeable // "null"')
            MERGEABLE_STATE=$(echo "$PR_DATA" | jq -r '.mergeable_state')
            CURRENT_HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head.sha')
          done
          
          # TOCTOU check: ensure HEAD SHA hasn't changed during waiting
          # Uses CURRENT_HEAD_SHA from the initial fetch or the last retry loop iteration
          if [ "$CURRENT_HEAD_SHA" != "$ORIGINAL_HEAD_SHA" ]; then
            echo "TOCTOU violation detected after retry loop!"
            
            COMMENT_BODY=$(printf '## New commits detected\n\nNew commits were pushed while validating this PR (after waiting for mergeable status).\n\n- Original HEAD SHA: `%s`\n- Current HEAD SHA: `%s`\n\nPlease run `/exec merge` again after the new commits are reviewed and approved.' "${ORIGINAL_HEAD_SHA:0:7}" "${CURRENT_HEAD_SHA:0:7}")
            
            gh api repos/$REPO/issues/$PR_NUMBER/comments \
              -f body="$COMMENT_BODY"
            
            exit 1
          fi
          
          if [ "$MERGEABLE" = "false" ] || [ "$MERGEABLE" = "null" ] || [ "$MERGEABLE_STATE" = "dirty" ]; then
            echo "Mergeability check failed!"
            
            if [ "$MERGEABLE" = "null" ]; then
              COMMENT_BODY=$(printf '## Mergeability status pending\n\nGitHub is still calculating mergeability for this PR.\n\n- Mergeable: `%s`\n- Mergeable State: `%s`\n- Retries: count=%s, interval=%ss\n\nPlease try `/exec merge` again shortly.' "$MERGEABLE" "$MERGEABLE_STATE" "$MERGEABLE_RETRY_COUNT" "$MERGEABLE_RETRY_INTERVAL")
            elif [ "$MERGEABLE_STATE" = "dirty" ]; then
              COMMENT_BODY=$(printf '## Conflicts detected\n\nThis PR has merge conflicts that must be resolved before merging.\n\n- Mergeable: `%s`\n- Mergeable State: `%s`\n\nPlease resolve the conflicts and try again.' "$MERGEABLE" "$MERGEABLE_STATE")
            else
              COMMENT_BODY=$(printf '## Cannot merge\n\nThis PR cannot be merged:\n\n- Mergeable: `%s`\n- Mergeable State: `%s`\n\nPlease resolve any conflicts or issues before attempting to merge.' "$MERGEABLE" "$MERGEABLE_STATE")
            fi
            
            gh api repos/$REPO/issues/$PR_NUMBER/comments \
              -f body="$COMMENT_BODY"
            
            exit 1
          fi
          
          echo "TOCTOU check passed. Proceeding with merge..."
          echo "Merging PR #$PR_NUMBER with method: $MERGE_METHOD"
          echo "HEAD SHA: $ORIGINAL_HEAD_SHA"
          
          # Prepare commit message body with traceability info
          COMMIT_MESSAGE_BODY="Merged-by: exec-merge (on behalf of @${COMMAND_ISSUER})"
          
          # Perform the merge
          MERGE_FAILED=false
          MERGE_RESULT=$(gh api repos/$REPO/pulls/$PR_NUMBER/merge \
            -X PUT \
            -f merge_method="$MERGE_METHOD" \
            -f sha="$ORIGINAL_HEAD_SHA" \
            -f commit_message="$COMMIT_MESSAGE_BODY" 2>&1) || MERGE_FAILED=true
          
          if [ "$MERGE_FAILED" = "true" ]; then
            echo "Merge failed!"
            echo "Result: $MERGE_RESULT"
            echo "merge_success=false" >> $GITHUB_OUTPUT
            echo "error_comment_posted=true" >> $GITHUB_OUTPUT
            
            # Extract error message
            ERROR_MSG=$(echo "$MERGE_RESULT" | jq -r '.message // "Unknown error"' 2>/dev/null || echo "$MERGE_RESULT")
            
            COMMENT_BODY=$(printf '## Merge failed\n\nFailed to merge PR:\n\n- Error: %s\n\nPlease check the PR status and try again.' "$ERROR_MSG")
            
            gh api repos/$REPO/issues/$PR_NUMBER/comments \
              -f body="$COMMENT_BODY"
            
            exit 1
          else
            echo "Merge successful!"
            echo "merge_success=true" >> $GITHUB_OUTPUT
            
            # Post merge result comment (check results already posted in previous step)
            COMMENT_BODY=$(printf '## Merged by exec-merge\n\nThis PR has been successfully merged.\n\n### Details\n\n- **Merge Method:** `%s`\n- **Base Branch:** `%s`\n- **Head Branch:** `%s`\n- **HEAD SHA:** `%s`' "$MERGE_METHOD" "$BASE_REF" "$HEAD_REF" "${ORIGINAL_HEAD_SHA:0:7}")
            
            gh api repos/$REPO/issues/$PR_NUMBER/comments \
              -f body="$COMMENT_BODY"
          fi

      # Notify user of unexpected errors that occur during the workflow
      # This step runs when the workflow fails but no specific error comment was posted
      # Uses conclusion check to handle cases where validate_command itself fails
      # Skip if any step already posted an error comment (error_comment_posted flag)
      - name: Notify on unexpected error
        if: |
          failure() && 
          steps.validate_command.conclusion == 'success' &&
          steps.validate_command.outputs.is_bot == 'false' && 
          steps.validate_command.outputs.command_valid == 'true' &&
          steps.report_results.outputs.error_comment_posted != 'true' &&
          steps.perform_merge.outputs.error_comment_posted != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -Eeuo pipefail
          
          RUN_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          
          COMMENT_BODY=$(printf '## Unexpected error\n\nAn unexpected error occurred while processing the `/exec merge` command.\n\nPlease check the [workflow run logs](%s) for details.' "$RUN_URL")
          
          gh api repos/$REPO/issues/$PR_NUMBER/comments \
            -f body="$COMMENT_BODY"
