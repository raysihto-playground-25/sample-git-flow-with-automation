name: Create Release PR from RC Tag

on:
  workflow_dispatch:
    inputs:
      rc-tag:
        description: "Existing RC tag (vX.Y.Z-rc.N)"
        required: true
        type: string

concurrency:
  group: create-release-pr
  cancel-in-progress: false

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.GHT_APP_ID }}
          private-key: ${{ secrets.GHT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs['rc-tag'] }}

      - name: Create PR
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC_TAG: ${{ inputs['rc-tag'] }}
          BASE_BRANCH: master
        run: |
          set -euo pipefail

          TAG="${RC_TAG%%-*}"
          RELEASE_BRANCH="release/${TAG#v}"
          git push origin "refs/tags/${RC_TAG}:refs/heads/${RELEASE_BRANCH}"

          TITLE="chore(release): Release ${TAG}"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "${BODY_FILE}"' EXIT
          cat > "${BODY_FILE}" << EOF
          * Release ${TAG}

          > [!CAUTION]
          > ※ この PR は "Merge コミットを作る" でマージしてください。 (Squash マージは NG)
          EOF

          # Create PR
          PR_URL=$(gh pr create \
            --head "${RELEASE_BRANCH}" \
            --base "${BASE_BRANCH}" \
            --title "${TITLE}" \
            --body-file "${BODY_FILE}")
          
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "release_branch=$RELEASE_BRANCH" >> $GITHUB_OUTPUT
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Workflow Summary
        run: |
          RC_TAG="${{ inputs['rc-tag'] }}"
          VERSION="${{ steps.create_pr.outputs.version }}"
          RELEASE_BRANCH="${{ steps.create_pr.outputs.release_branch }}"
          PR_URL="${{ steps.create_pr.outputs.pr_url }}"

          echo "## Create Release PR Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **RC Tag** | \`${RC_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Release Branch** | \`${RELEASE_BRANCH}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Base Branch** | \`master\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Pull Request** | ${PR_URL} |" >> $GITHUB_STEP_SUMMARY
