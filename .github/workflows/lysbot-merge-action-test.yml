name: lysbot-merge-action-test

# =============================================================================
# Runs unit tests for the lysbot-merge TypeScript action
# =============================================================================
# This workflow ensures that:
# 1. The TypeScript action compiles successfully
# 2. All unit tests pass
# 3. The action is ready for use
#
# TRIGGERS:
# - pull_request: Automatically runs when PRs modify lysbot-merge action files
# - workflow_run: Automatically runs after lysbot-merge-upgrade-deps completes
# - workflow_dispatch: Manual trigger for on-demand testing
#
# The workflow_run trigger ensures tests run even if a PR is not immediately
# created (e.g., if there are no dependency changes). The pull_request trigger
# ensures tests run on any PR touching the action code.
# =============================================================================

on:
  pull_request:
    paths:
      - ".github/actions/lysbot-merge/**"
      - ".github/workflows/lysbot-merge-action-test.yml"
  workflow_run:
    # NOTE: This workflow name must match the 'name' field in
    # lysbot-merge-upgrade-deps.yml. If that workflow is renamed,
    # this trigger must be updated accordingly.
    workflows: ["lysbot-merge Dependency Update"]
    types: [completed]
  workflow_dispatch:

defaults:
  run:
    working-directory: .github/actions/lysbot-merge

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    # Run tests in these scenarios:
    # 1. When triggered by a pull request modifying lysbot-merge files
    # 2. When manually triggered via workflow_dispatch
    # 3. When triggered by workflow_run AND the upstream workflow succeeded
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ".github/actions/lysbot-merge/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Check dead-code
        run: npm run check:deadcode

      - name: Check code formatting
        run: npm run check:format

      - name: Run linter
        run: npm run check:lint

      - name: Run type checks
        run: npm run check:type

      - name: Run tests with coverage
        run: |
          set -Eeuo pipefail
          npm run check:test | tee /tmp/coverage-${{ github.run_id }}.txt

      - name: Report coverage to summary
        if: success()
        run: |
          set -Eeuo pipefail
          {
            echo "## Test Coverage Report"
            echo ""

            if [ -f /tmp/coverage-${{ github.run_id }}.txt ] && grep -q "Coverage report" /tmp/coverage-${{ github.run_id }}.txt; then
              echo '| File | % Stmts | % Branch | % Funcs | % Lines | Uncovered Line #s |'
              echo '|:-----|--------:|---------:|--------:|--------:|--------------------|'
              sed -n '/^File/{n;:loop;n;/^-/q;p;b loop;}' /tmp/coverage-${{ github.run_id }}.txt
            else
              echo '_Coverage data not available_'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          rm -f /tmp/coverage-${{ github.run_id }}.txt

      - name: Bundle action
        run: npm run bundle

      - name: Verify dist is up to date
        run: |
          set -Eeuo pipefail
          # If dist/ doesn't exist after build, that's an error
          if [ ! -d "dist" ]; then
            echo "::error::dist/ directory was not created by the build. Check the build configuration."
            exit 1
          # Check if dist/ directory exists and has changes
          elif [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ directory is out of date. Run 'npm run bundle' and commit the changes."
            git diff dist/
            exit 1
          fi
