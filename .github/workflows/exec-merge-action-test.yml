name: exec-merge-action-test

# =============================================================================
# Runs unit tests for the exec-merge TypeScript action
# =============================================================================
# This workflow ensures that:
# 1. The TypeScript action compiles successfully
# 2. All unit tests pass
# 3. The action is ready for use
# =============================================================================

on:
  pull_request:
    paths:
      - '.github/actions/exec-merge/**'

defaults:
  run:
    working-directory: .github/actions/exec-merge

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '.github/actions/exec-merge/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Report coverage to summary
        run: |
          echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Generate Markdown table from JSON coverage summary with right-aligned numbers
          if [ -f coverage/coverage-summary.json ]; then
            echo "| Metric | Covered | Total | Percentage |" >> $GITHUB_STEP_SUMMARY
            echo "|:-------|--------:|------:|-----------:|" >> $GITHUB_STEP_SUMMARY
            jq -r '.total as $t | [
              ["Statements", $t.statements.covered, $t.statements.total, $t.statements.pct],
              ["Branches",   $t.branches.covered,   $t.branches.total,   $t.branches.pct],
              ["Functions",  $t.functions.covered,  $t.functions.total,  $t.functions.pct],
              ["Lines",      $t.lines.covered,      $t.lines.total,      $t.lines.pct]
            ][] | @tsv' coverage/coverage-summary.json | \
              while IFS=$'\t' read -r metric covered total pct; do
                printf "| %s | %d | %d | %.2f%% |\n" "$metric" "$covered" "$total" "$pct"
              done >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build action
        run: npm run build

      - name: Verify dist is up to date
        run: |
          # Check if dist/ directory exists and has changes
          if [ -d "dist" ] && [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ directory is out of date. Run 'npm run build' and commit the changes."
            git diff dist/
            exit 1
          fi
          # If dist/ doesn't exist after build, that's also an error
          if [ ! -d "dist" ]; then
            echo "::error::dist/ directory was not created by the build. Check the build configuration."
            exit 1
          fi
