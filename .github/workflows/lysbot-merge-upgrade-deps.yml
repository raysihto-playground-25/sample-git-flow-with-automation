name: lysbot-merge Dependency Update

# =============================================================================
# lysbot-merge Dependency Update Workflow
# =============================================================================
# This workflow automatically updates npm dependencies in the lysbot-merge
# action by running `npm run all:full-upgrade` and creating a PR with changes.
#
# TRIGGERS:
# - Manual trigger (`on.workflow_dispatch`)
# - Scheduled trigger (`on.schedule`)
#
# REQUIRED PERMISSIONS:
# - contents: write    - To push changes to a new branch
# - pull-requests: write - To create and manage PRs
#
# REQUIRED REPOSITORY SETTINGS:
# 1. Under Settings > Actions > General > Workflow permissions:
#    - Enable "Read and write permissions" OR
#    - Use a PAT (Personal Access Token) with repo scope
# 2. Allow GitHub Actions to create and approve pull requests (optional, for
#    better automation experience)
#
# WORKFLOW BEHAVIOR:
# 1. Checks out the repository
# 2. Runs `npm run all:full-upgrade` in .github/actions/lysbot-merge directory
# 3. Creates or updates a PR with dependency updates:
#    - Branch name is unique per base branch (e.g., bot/lysbot-merge-deps/develop)
#    - If no existing PR exists for this base branch, creates a new one
#    - If an existing PR exists for this base branch, updates it with the latest changes (force-push)
#    - If no changes are detected, the action automatically skips PR creation
#
# PR LABELING:
# - Automatically adds 'dependencies' label to the PR
# - You may customize labels by modifying the 'labels' input below
# =============================================================================

on:
  # Manual trigger
  # - By default, this workflow runs on the repository's default branch if executed without changing any settings.
  # - The target branch can be explicitly changed at execution time via the GitHub Actions UI.
  workflow_dispatch:

  # Scheduled trigger
  # - This workflow runs on the repository's default branch only.
  # - Branch selection is not supported for scheduled executions.
  schedule:
    # Runs every Saturday at 9:00 AM UTC
    - cron: "0 9 * * 6"

  # Repository dispatch trigger
  # - Triggered via repository_dispatch API when /lysbot merge command is executed
  # - Runs on the branch specified in the dispatch event (client_payload.ref)
  repository_dispatch:
    types: [lysbot-merge-trigger]

# Ensure only one lysbot-merge dependency update workflow runs at a time per base branch
concurrency:
  group: lysbot-merge-deps/${{ github.event.client_payload.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  update-dependencies:
    name: Update lysbot-merge Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # For repository_dispatch events, check out the branch specified in client_payload.ref
          # Otherwise, use the default behavior (github.ref_name for workflow_dispatch, default branch for schedule)
          ref: ${{ github.event.client_payload.ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ".github/actions/lysbot-merge/package-lock.json"

      - name: Run dependency upgrade
        id: upgrade
        working-directory: .github/actions/lysbot-merge
        run: |
          npm run all:full-upgrade
          echo "✅ Dependency upgrade completed successfully"

      - name: Create or Update Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "ci(deps-lysbot-merge): update dependencies"
          title: "ci(deps-lysbot-merge): update dependencies"
          body: |
            ## Automated Dependency Update

            This PR updates npm dependencies in the lysbot-merge action to their latest versions.

            ---
            _This PR was automatically created by the [lysbot-merge-upgrade-deps workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/lysbot-merge-upgrade-deps.yml)._
            _Triggered by: @${{ github.actor }}_
          branch: bot/lysbot-merge-deps/${{ github.ref_name }}
          delete-branch: true
          labels: dependencies
