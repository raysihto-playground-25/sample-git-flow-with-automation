name: lysbot-merge Dependency Update

# =============================================================================
# lysbot-merge Dependency Update Workflow
# =============================================================================
# This workflow automatically updates npm dependencies in the lysbot-merge
# action by running `npm run all:full-upgrade` and creating a PR with changes.
#
# TRIGGERS:
# - Manual trigger via workflow_dispatch
# - Schedule trigger
#
# REQUIRED PERMISSIONS:
# - contents: write    - To push changes to a new branch
# - pull-requests: write - To create and manage PRs
#
# REQUIRED REPOSITORY SETTINGS:
# 1. Under Settings > Actions > General > Workflow permissions:
#    - Enable "Read and write permissions" OR
#    - Use a PAT (Personal Access Token) with repo scope
# 2. Allow GitHub Actions to create and approve pull requests (optional, for
#    better automation experience)
#
# WORKFLOW BEHAVIOR:
# 1. Checks out the repository
# 2. Runs `npm run all:full-upgrade` in .github/actions/lysbot-merge directory
#    - Deletes package-lock.json
#    - Updates all dependencies to latest versions
#    - Runs linting, formatting, and tests
#    - Rebuilds the action bundle
# 3. If changes are detected:
#    - Creates a new PR with dependency updates
#    - If an old PR from this workflow exists, closes it with a reference
#      to the new PR
# 4. If no changes are detected, skips PR creation
#
# BRANCH NAMING:
# - Uses: bot/lysbot-merge-deps-{run_id}
#
# PR LABELING:
# - Automatically adds 'dependencies' label to the PR
# - You may customize labels by modifying the 'labels' input below
# =============================================================================

on:
  # Manual trigger
  workflow_dispatch:

  # Schedule trigger: Runs every Saturday at 9:00 AM UTC
  schedule:
    - cron: '0 9 * * 6'

# Ensure only one lysbot-merge dependency update workflow runs at a time
concurrency:
  group: lysbot-merge-upgrade-deps
  cancel-in-progress: false

jobs:
  update-dependencies:
    name: Update lysbot-merge Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ".github/actions/lysbot-merge/package-lock.json"

      - name: Run dependency upgrade
        id: upgrade
        working-directory: .github/actions/lysbot-merge
        run: |
          # Run the full upgrade process
          npm run all:full-upgrade

          echo "✅ Dependency upgrade completed successfully"

      - name: Check for changes
        id: check_changes
        run: |
          # Check if there are any changes after the upgrade
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes detected - dependencies are already up to date"
          fi

      - name: Find existing dependency update PRs
        id: find_existing_pr
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find existing open PRs created by this workflow
          # We identify them by looking for PRs from branches with the prefix "bot/lysbot-merge-deps-"
          # and created by github-actions[bot]
          EXISTING_PRS=$(gh pr list \
            --author "app/github-actions" \
            --state open \
            --json number,title,headRefName \
            --jq '.[] | select(.headRefName | startswith("bot/lysbot-merge-deps-")) | .number' \
            | tr '\n' ' ')

          if [ -n "$EXISTING_PRS" ]; then
            echo "existing_prs=$EXISTING_PRS" >> $GITHUB_OUTPUT
            echo "✅ Found existing PR(s): $EXISTING_PRS"
          else
            echo "existing_prs=" >> $GITHUB_OUTPUT
            echo "ℹ️ No existing dependency update PRs found"
          fi

      - name: Create Pull Request
        id: create_pr
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "ci(deps-lysbot-merge): update dependencies"
          title: "ci(deps-lysbot-merge): update dependencies"
          body: |
            ## Automated Dependency Update

            This PR updates npm dependencies in the lysbot-merge action to their latest versions.

            ---
            _This PR was automatically created by the [lysbot-merge-upgrade-deps workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/lysbot-merge-upgrade-deps.yml)._
            _Triggered by: @${{ github.actor }}_
          branch: bot/lysbot-merge-deps-${{ github.run_id }}
          delete-branch: true
          labels: dependencies
          # Use default branch as base
          # base: develop

      - name: Close old dependency update PRs
        if: steps.check_changes.outputs.has_changes == 'true' && steps.find_existing_pr.outputs.existing_prs != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_PR_URL="${{ steps.create_pr.outputs.pull-request-url }}"
          EXISTING_PRS="${{ steps.find_existing_pr.outputs.existing_prs }}"

          echo "Closing old dependency update PR(s): $EXISTING_PRS"
          echo "New PR: $NEW_PR_URL"

          for PR_NUMBER in $EXISTING_PRS; do
            # Skip if this is the newly created PR
            if gh pr view "$PR_NUMBER" --json url --jq .url | grep -q "$NEW_PR_URL"; then
              echo "Skipping PR #$PR_NUMBER (this is the new PR)"
              continue
            fi

            echo "Closing PR #$PR_NUMBER"
            gh pr close "$PR_NUMBER" --comment "Closing this PR as a new dependency update PR has been created: $NEW_PR_URL"
          done
