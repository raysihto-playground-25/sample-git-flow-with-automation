# =============================================================================
# lysbot-merge - PR Merge Automation Action
# =============================================================================
# A composite action that provides automated PR merging via the `/lysbot merge`
# command in PR comments. This action encapsulates all the validation and
# merge logic previously in the reusable workflow.
#
# USAGE:
# This action is called from a workflow triggered by issue_comment events.
#
#   on:
#     issue_comment:
#       types: [created]
#
#   jobs:
#     lysbot-merge:
#       runs-on: ubuntu-latest
#       permissions:
#         contents: write
#         pull-requests: write
#         issues: write
#       steps:
#         - uses: {ORG}/{REPO}/.github/actions/lysbot-merge@develop
#           with:
#             github-token: ${{ secrets.GITHUB_TOKEN }}
#             options: |
#               release-branch-prefix: "release/"
#               develop-branch: "develop"
#               sync-branch-prefix: "fix/sync/"
#
# NOTES:
# - Replace `{ORG}` with the organization or user name and `{REPO}` with the
#   repository name where this action is hosted.
# - This Action has no stable release yet. Please use `@develop` until the
#   first versioned tag becomes available.
#
# LIMITATIONS:
# - Fork PRs are NOT supported (GITHUB_TOKEN has limited permissions)
# - Only organization owners, members, or collaborators with write access
#   can use the `/lysbot merge` command
#
# THIRD-PARTY LICENSES:
# - Twemoji graphics (https://github.com/twitter/twemoji) are used for emoji
#   display compatibility. Licensed under CC-BY 4.0.
# =============================================================================

name: 'lysbot-merge'
description: 'Automated PR merging with validation checks via /lysbot merge command'

inputs:
  github-token:
    description: 'GitHub token for API authentication'
    required: true
  options:
    description: |
      OPTIONAL: Optional configuration in YAML format. All options are optional.
      Example:
        options: |
          release-branch-prefix: "release/"
          develop-branch: "develop"
          sync-branch-prefix: "fix/sync/"
          mergeable-retry-count: 5
          mergeable-retry-interval: 10
    required: false
    default: ''
  # DEPRECATED: The following inputs are deprecated and will be removed in a future version.
  # Use the 'options' parameter instead with kebab-case keys.
  release_branch_prefix:
    description: 'DEPRECATED: Prefix for release branches (e.g., "release/")'
    required: false
    deprecationMessage: "'release_branch_prefix' is deprecated and will be removed in a future release."
  develop_branch:
    description: 'DEPRECATED: Name of the develop branch'
    required: false
    deprecationMessage: "'develop_branch' is deprecated and will be removed in a future release."
  sync_branch_prefix:
    description: 'DEPRECATED: Prefix for sync branches used in back-merges (e.g., "fix/sync/")'
    required: false
    deprecationMessage: "'sync_branch_prefix' is deprecated and will be removed in a future release."
  mergeable_retry_count:
    description: 'DEPRECATED: Number of retries for waiting on GitHub to calculate mergeable status'
    required: false
    deprecationMessage: "'mergeable_retry_count' is deprecated and will be removed in a future release."
  mergeable_retry_interval:
    description: 'DEPRECATED: Interval in seconds between retries'
    required: false
    deprecationMessage: "'mergeable_retry_interval' is deprecated and will be removed in a future release."

outputs:
  result:
    description: 'Result of the merge operation (merged, skipped, failed)'
  merge_method:
    description: 'Merge method used (squash or merge)'

runs:
  using: 'node24'
  main: 'dist/index.js'
