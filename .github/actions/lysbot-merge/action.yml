# =============================================================================
# lysbot-merge - PR Merge Automation Action
# =============================================================================
# A composite action that provides automated PR merging via the `/lysbot merge`
# command in PR comments. This action encapsulates all the validation and
# merge logic previously in the reusable workflow.
#
# USAGE:
# This action is called from a workflow triggered by issue_comment events.
#
#   on:
#     issue_comment:
#       types: [created]
#
#   jobs:
#     lysbot-merge:
#       runs-on: ubuntu-latest
#       permissions:
#         contents: write
#         pull-requests: write
#         issues: write
#       steps:
#         - uses: {ORG}/{REPO}/.github/actions/lysbot-merge@develop
#           with:
#             token: ${{ secrets.GITHUB_TOKEN }}
#             # release_branch_prefix: "release/"
#             # develop_branch: "develop"
#             # sync_branch_prefix: "fix/sync/"
#
# NOTES:
# - Replace `{ORG}` with the organization or user name and `{REPO}` with the
#   repository name where this action is hosted.
# - This Action has no stable release yet. Please use `@develop` until the
#   first versioned tag becomes available.
#
# AUTHORIZATION:
# - Users must have BOTH valid author association (OWNER/MEMBER/COLLABORATOR)
#   AND write-level permissions (admin/maintain/write) to execute /lysbot merge
# - See README.md "User Authorization" section for complete details
#
# LIMITATIONS:
# - Fork PRs are NOT supported (this action explicitly rejects fork PRs as a
#   design decision; typical usage with passed GITHUB_TOKEN has restrictions)
#
# THIRD-PARTY LICENSES:
# - Twemoji graphics (https://github.com/twitter/twemoji) are used for emoji
#   display compatibility. Licensed under CC-BY 4.0.
# =============================================================================

name: 'lysbot-merge'
description: 'Automated PR merging with validation checks via /lysbot merge command'

inputs:
  token:
    description: 'GitHub token for API authentication'
    required: false
    default: ${{ github.token }}
  release_branch_prefix:
    description: 'OPTIONAL: Prefix for release branches (e.g., "release/")'
    required: false
    default: 'release/'
  develop_branch:
    description: 'OPTIONAL: Name of the develop branch'
    required: false
    default: 'develop'
  sync_branch_prefix:
    description: 'OPTIONAL: Prefix for sync branches used in back-merges (e.g., "fix/sync/")'
    required: false
    default: 'fix/sync/'
  mergeable_retry_count:
    description: 'OPTIONAL: Number of retries for waiting on GitHub to calculate mergeable status (valid range: 1-20)'
    required: false
    default: '5'
  mergeable_retry_interval:
    description: 'OPTIONAL: Interval in seconds between retries (valid range: 1-60)'
    required: false
    default: '10'

outputs:
  result:
    description: 'Result of the merge operation (merged, skipped, failed, already_merged)'
  merge_method:
    description: 'Merge method used (squash or merge)'

runs:
  using: 'node24'
  main: 'dist/index.js'
